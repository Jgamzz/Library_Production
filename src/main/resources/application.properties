# =============================================================
# CONFIGURAÇÕES GERAIS E UPLOADS
# =============================================================
path.documents=C:/Images

# =============================================================
# CONFIGURAÇÕES DO BANCO DE DADOS (MySQL) (BANCO LOCAL)
# =============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/Library
spring.datasource.username=root
spring.datasource.password=141516Ka!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================
# CONFIGURAÇÕES DO HIBERNATE / JPA
# =============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Formata o SQL no console para facilitar a leitura em DEBUG
spring.jpa.properties.hibernate.format_sql=true

# =============================================================
# CONFIGURAÇÃO DE LOGS (SALVAMENTO EM PASTA ESPECÍFICA)
# =============================================================

# Caminho exato solicitado para a pasta no Desktop
logging.file.name=C:/Imagens

# Níveis de detalhe para suas classes de Engenharia
logging.level.root=INFO
logging.level.AppService=DEBUG
logging.level.Controllers=DEBUG
logging.level.Exceptions=DEBUG

# Silenciar logs excessivos do framework no arquivo
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR

# Padrão de formatação: Data - Nível - [Thread] - Classe - Mensagem
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Política de Rotação: Mantém o arquivo organizado e seguro
# Limita cada arquivo a 10MB e mantém o histórico por 7 dias
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7